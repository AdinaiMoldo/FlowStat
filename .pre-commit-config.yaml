repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: architecture-tests
        name: layering and allowed imports
        entry: python -m pytest tests/architecture -q
        language: system
        pass_filenames: false
