36" points="1087.71,290.7,1079.6597,285.0262,1082.8055,289.7277,1078.104,292.8734,1087.71,290.7" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="69" x="932" y="236.2838">control key</text><!--link services to core--><path d="M1087.95,324.78 C1026.55,335.03 941.66,339.95 875,308.69 C840.98,292.74 815.96,255.49 802.44,230.96 " fill="none" id="services-core" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="800.05,226.53,800.8235,236.3484,802.4333,230.9255,807.8562,232.5352,800.05,226.53" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="114" x="909.5" y="305.2838">ingest key, events</text><!--
@startuml context
skinparam shadowing false
left to right direction

actor "Committee staff" as staff
rectangle "Browser UI (served by the core)" as ui
rectangle "FlowStat core" as core
database "SQLite file of the core" as db
folder "Data directory\n(forms, reports)" as data
rectangle "Allowed HTTP hosts" as hosts
rectangle "Deployed services\n(process or container)" as services

staff - -> ui : designs, runs, approves
ui - -> core : REST, bearer token
core - -> db : workflows, runs, events
core - -> data : action files
core - -> hosts : http.call, only the listed hosts
core - -> services : control key
services - -> core : ingest key, events
@enduml

