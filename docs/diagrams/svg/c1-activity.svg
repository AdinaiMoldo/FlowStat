59,362,1234.3159,366,1224.3159,362,1228.3159" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="134.5" x2="134.5" y1="1268.8354" y2="1286.8354"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="134.5" x2="236.25" y1="1286.8354" y2="1286.8354"/><polygon fill="#A80036" points="226.25,1282.8354,236.25,1286.8354,226.25,1290.8354,230.25,1286.8354" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="362" x2="362" y1="1268.8354" y2="1286.8354"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="362" x2="260.25" y1="1286.8354" y2="1286.8354"/><polygon fill="#A80036" points="270.25,1282.8354,260.25,1286.8354,270.25,1290.8354,266.25,1286.8354" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="248.25" x2="248.25" y1="1180.3159" y2="1200.3159"/><polygon fill="#A80036" points="244.25,1190.3159,248.25,1200.3159,252.25,1190.3159,248.25,1194.3159" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="248.25" x2="248.25" y1="1298.8354" y2="1318.8354"/><polygon fill="#A80036" points="244.25,1308.8354,248.25,1318.8354,252.25,1308.8354,248.25,1312.8354" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml c1-activity
skinparam shadowing false

start
:read_yaml: the text to a tree with positions;
if (syntax errors?) then (yes)
  :diagnostics only;
  stop
endif
:check_shape: table-driven, did-you-mean for a key;
if (shape errors?) then (yes)
  :diagnostics only;
  stop
endif
:build_workflow: the typed view of the document;
:phase 1, expand: foreach over a list of the catalogue,\none instance per item, with a source map;
:phase 2, resolve: needs and ${...} to instances\n(load[region], check[*]);
:phase 3, strongly_connected_components\n(explicit stack, no recursion);
if (a component with a cycle?) then (yes)
  :shortest_cycle: a breadth-first search from every node\nof the component, the shortest is reported;
  :diagnostics only;
  stop
endif
:topological_order: the order of the plan;
:ancestor_bitsets: every step read from\nis guaranteed to run before the reader;
:phase 4: types of the expressions and arguments\n(analysis/types.py, check_types);
if (any error?) then (yes)
  :diagnostics (warnings stay with the plan);
else (no)
  :the plan, with its warnings;
endif
stop
@enduml

