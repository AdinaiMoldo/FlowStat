eight="bold" lengthAdjust="spacingAndGlyphs" textLength="172" x="235.5" y="320.7021">[every reference of every step]</text><polygon fill="#A80036" points="734.5,343.5049,744.5,347.5049,734.5,351.5049,738.5,347.5049" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="189.5" x2="740.5" y1="347.5049" y2="347.5049"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="207" x="196.5" y="342.3691">entails(guard, available), domains</text><polygon fill="#A80036" points="200.5,373.2344,190.5,377.2344,200.5,381.2344,196.5,377.2344" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="194.5" x2="745.5" y1="377.2344" y2="377.2344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="287" x="206.5" y="372.0986">UNSAT (proved), SAT (a case), or UNKNOWN</text><polygon fill="#A80036" points="77.5,409.9639,67.5,413.9639,77.5,417.9639,73.5,413.9639" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="71.5" x2="188.5" y1="413.9639" y2="413.9639"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="70" x="83.5" y="408.8281">diagnostics</text><!--
@startuml c2-sequence
skinparam shadowing false

actor "WorkflowService" as caller
participant "analyse" as analyse
participant "lower_guards" as lower
participant "compute" as compute
participant "run_conditions" as runs
participant "entails (solver)" as solver

caller -> analyse : plan, signatures
analyse -> lower : plan, signatures
lower - -> analyse : predicates, domains
analyse -> compute : plan, predicates
compute -> runs : plan, predicates
runs - -> compute : run condition of every step
compute - -> analyse : guaranteed facts
loop every reference of every step
  analyse -> solver : entails(guard, available), domains
  solver - -> analyse : UNSAT (proved), SAT (a case), or UNKNOWN
end
analyse - -> caller : diagnostics
@enduml

