ont-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="252" x="303.25" y="203.0938">control key (run, decide, migrate, rotate)</text><!--link service to core--><path d="M573.26,209.5 C488.42,209.5 372.07,209.5 290.49,209.5 " fill="none" id="service-core" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="285.17,209.5,294.17,213.5,290.17,209.5,294.17,205.5,285.17,209.5" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="208" x="325.25" y="203.0938">ingest key (outbox, at least once)</text><!--
@startuml deployment
skinparam shadowing false

node "Host of the core" {
  component "python -m flowstat.serve" as core
  database "core.sqlite" as coredb
  folder "data directory" as data
}

node "Host of a service (process or Docker container)" as host {
  component "python -m flowstat.api.service" as service
  database "service.sqlite\n(own event log, source of truth)" as servicedb
  artifact "bundle\n(plan, catalogue snapshot)" as bundle
}

actor "Browser" as browser

browser - -> core : HTTP
core - -> coredb
core - -> data
core ..> bundle : build and start
service - -> servicedb
service - -> bundle
core - -> service : control key (run, decide, migrate, rotate)
service - -> core : ingest key (outbox, at least once)
@enduml

