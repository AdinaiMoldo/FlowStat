#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="236" x="588" y="294.3691">sat with a witness, unsat, or unknown</text><polygon fill="#A80036" points="319,332.2344,309,336.2344,319,340.2344,315,336.2344" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="313" x2="570" y1="336.2344" y2="336.2344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="239" x="325" y="331.0986">sat (a case), unsat (a proof), unknown</text><polygon fill="#A80036" points="76,361.9639,66,365.9639,76,369.9639,72,365.9639" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="70" x2="307" y1="365.9639" y2="365.9639"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="185" x="82" y="360.8281">a finding with a case, or none</text><!--
@startuml c6-sequence
skinparam shadowing false

participant "guards.analyse" as guards
participant "overlap, uncovered" as ask
participant "check" as check
participant "dnf" as dnf
participant "_solve_clause" as clause
participant "solve_differences" as bf

guards -> ask : guards of a branch group, domains
ask -> check : And(p, q) or And(Not p...)
check -> dnf : nnf(pred), cap
dnf - -> check : clauses, or None
loop every clause
  check -> clause : clause, domains
  clause -> bf : difference edges (when two variables meet)
  bf - -> clause : values, or a negative cycle
  clause - -> check : sat with a witness, unsat, or unknown
end
check - -> ask : sat (a case), unsat (a proof), unknown
ask - -> guards : a finding with a case, or none
@enduml

