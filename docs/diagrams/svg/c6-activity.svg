775,194.5,1007.9775,198.5,997.9775,194.5,1001.9775" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="194.5" x2="194.5" y1="1042.4971" y2="1062.4971"/><polygon fill="#A80036" points="190.5,1052.4971,194.5,1062.4971,198.5,1052.4971,194.5,1056.4971" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="194.5" x2="194.5" y1="1111.5361" y2="1131.5361"/><polygon fill="#A80036" points="190.5,1121.5361,194.5,1131.5361,198.5,1121.5361,194.5,1125.5361" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="194.5" x2="194.5" y1="1166.0557" y2="1186.0557"/><polygon fill="#A80036" points="190.5,1176.0557,194.5,1186.0557,198.5,1176.0557,194.5,1180.0557" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="194.5" x2="194.5" y1="1235.0947" y2="1255.0947"/><polygon fill="#A80036" points="190.5,1245.0947,194.5,1255.0947,198.5,1245.0947,194.5,1249.0947" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="194.5" x2="194.5" y1="836.6025" y2="884.4189"/><polygon fill="#A80036" points="190.5,874.4189,194.5,884.4189,198.5,874.4189,194.5,878.4189" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="194.5" x2="194.5" y1="1289.6143" y2="1321.6143"/><polygon fill="#A80036" points="190.5,1311.6143,194.5,1321.6143,198.5,1311.6143,194.5,1315.6143" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml c6-activity
skinparam shadowing false

start
partition "check(pred, domains)" {
  :clauses = dnf(nnf(pred), cap 64);
  if (more than the cap?) then (yes)
    :unknown;
    stop
  endif
  repeat
    :solve_clause(clause, domains);
    note right
      one-variable atoms restrict the domain of the variable;
      opaque atoms: unsat if the rest is unsat, else unknown;
      two-variable atoms become edges, solved by Bellman-Ford
      (a negative cycle is unsat).
    end note
    if (sat and holds(pred, witness)?) then (yes)
      :return sat with the witness;
      stop
    endif
  repeat while (another clause?)
  if (any clause was unknown?) then (yes)
    :unknown;
  else (no)
    :unsat;
  endif
}
stop

start
partition "generate(plan)" {
  :run[s] = guard(s) and join(s, run of the needs);
  :for every guarded step and each of run, skip:\ncheck(run[s] or not run[s], domains);
  :unsat: infeasible; sat: a base candidate;
  :candidates: the bases and, for each, one-variable changes\n(at most 600);
  :reach[c] = targets that predict decides as run or skip;
  :cover = greedy(reach);\nbetter = exact_search smaller than the cover;
  :missed = feasible targets that no candidate reaches;
}
stop
@enduml

