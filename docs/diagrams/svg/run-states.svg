f" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="265" x="598.96" y="500.0938">the time limit or a cancel ends the last step</text><!--link COMPENSATING to FINISHED--><path d="M91.77,520.08 C101.78,536.29 117.28,556.55 136.96,567 C231.44,617.18 560.4,621.54 683.75,621.35 " fill="none" id="COMPENSATING-FINISHED" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="688.76,621.34,679.7486,617.3657,683.76,621.3543,679.7715,625.3657,688.76,621.34" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="406" x="137.96" y="563.5938">every undo is final (COMPENSATED or COMPENSATION_FAILED)</text><!--link FINISHED to *end--><path d="M730.96,647.21 C730.96,664.84 730.96,688.13 730.96,702.84 " fill="none" id="FINISHED-*end" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="730.96,707.84,734.96,698.84,730.96,702.84,726.96,698.84,730.96,707.84" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml run-states
skinparam shadowing false

state CREATED
state RUNNING
state WAITING
state COMPENSATING
state FINISHED

[*] - -> CREATED

CREATED - -> RUNNING : RUN_STARTED
CREATED - -> FINISHED : cancelled before the start

RUNNING - -> WAITING : a step waits for an answer, or one is UNCERTAIN
WAITING - -> RUNNING : the answer came, or a person resolved the step
RUNNING - -> COMPENSATING : every step is final and a step failed under on_failure compensate
COMPENSATING - -> WAITING : an undo is UNCERTAIN and no other runs
WAITING - -> COMPENSATING : the person resolves the undo
RUNNING - -> FINISHED : every step is final; the outcome is set
WAITING - -> FINISHED : the time limit or a cancel ends the last step
COMPENSATING - -> FINISHED : every undo is final (COMPENSATED or COMPENSATION_FAILED)

FINISHED - -> [*]
@enduml

