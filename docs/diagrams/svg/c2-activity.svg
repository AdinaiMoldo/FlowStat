;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="121" x2="121" y1="583.5313" y2="616.0508"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="121" x2="230.5" y1="616.0508" y2="616.0508"/><polygon fill="#A80036" points="220.5,612.0508,230.5,616.0508,220.5,620.0508,224.5,616.0508" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="364" x2="364" y1="598.0508" y2="616.0508"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="364" x2="254.5" y1="616.0508" y2="616.0508"/><polygon fill="#A80036" points="264.5,612.0508,254.5,616.0508,264.5,620.0508,260.5,616.0508" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="242.5" x2="242.5" y1="495.0117" y2="515.0117"/><polygon fill="#A80036" points="238.5,505.0117,242.5,515.0117,246.5,505.0117,242.5,509.0117" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="242.5" x2="242.5" y1="628.0508" y2="648.0508"/><polygon fill="#A80036" points="238.5,638.0508,242.5,648.0508,246.5,638.0508,242.5,642.0508" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="242.5" x2="242.5" y1="682.5703" y2="702.5703"/><polygon fill="#A80036" points="238.5,692.5703,242.5,702.5703,246.5,692.5703,242.5,696.5703" style="stroke: #A80036; stroke-width: 1.0;"/><!--
@startuml c2-activity
skinparam shadowing false

start
:lower_guards: the guard of every step as a predicate\nand the domain of every variable;
:compute, in plan order;
partition "for every step Y" {
  :runs[Y] = guard(Y) and gate(join(Y), runs of the needs);
  :facts of Y by the rule of its join\n(all_success: OR, any_success and at_least: AND, all_done: nothing);
  :facts of a clean ancestor X |= lo(runs[X])\n(no continue at or above X);
  :drop facts of more than 300 nodes;
}
:analyse: for every reference to X in Y;
if (entails(guard(Y), Av[Y][X]) is UNSAT?) then (the guard proves X ran)
  :the read is safe: no warning;
else (a case is found, or unknown)
  :a warning with the condition and\na value of the inputs that breaks it;
endif
:groups, goals, dead steps, undo: notes and warnings;
stop
@enduml

